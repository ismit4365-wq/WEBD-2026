<!DOCTYPE html>
<html>
<head>
    <title>Student Branch Nested Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        /* Nested table ki styling ke liye */
        .nested-table {
            width: 100%;
            margin: 0;
        }
        .nested-table th, .nested-table td {
            border: 1px solid #999;
            background-color: #fafafa;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Student Details with Nested Branch Table</h2>

    <table>
        <tr>
            <th>Serial No.</th>
            <th>Name of Student</th>
            <th>Branch (Nested Table)</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Rahul Sharma</td>
            <td>
                <!-- Nested Table for Branches -->
                <table class="nested-table">
                    <tr>
                        <th>Branch No.</th>
                        <th>Branch Name</th>
                    </tr>
                    <tr>
                        <td>01</td>
                        <td>Computer Science</td>
                    </tr>
                    <tr>
                        <td>02</td>
                        <td>Information Technology</td>
